aid: razor-group
name: Razor Group
description: 'Razor Group (Whele LLC) is a Berlin- and Boston-headquartered consumer
  goods holding company that acquires, consolidates and scales profitable e-commerce
  brands selling on Amazon FBA, Walmart, Target, Chewy and other online marketplaces.
  Founded in 2020, the company has raised over $1 billion, employs 450+ people across
  five offices in Europe, North America and Asia, and operates more than 40,000 SKUs
  across brands including GymKeg, POWRX, Tranquil Spa and Porto Vino. In August 2025
  Razor merged with Infinite Commerce to form the largest consolidator in the FBA
  aggregator space, operating a unified internal technology platform for demand
  forecasting, pricing and advertising. Razor Group is a buyer and operator of
  physical consumer products, not a software vendor: it publishes no public API, SDK,
  webhook surface or developer portal.'
